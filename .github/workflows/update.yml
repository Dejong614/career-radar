name: Collect jobs and publish

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'index.html'

concurrency:
  group: career-radar
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      collection_outcome: ${{ steps.collect.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      # One-time browser-upload bootstrap; subsequent runs use normal tracked files.
      - name: Unpack initial source archive if present
        run: |
          if [ -f career-radar-source.zip ]; then
            python -m zipfile -e career-radar-source.zip .
            rm career-radar-source.zip
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify collector and analytics
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node tests/analytics.test.js
          node --check web/app.js
      - name: Collect employer postings
        id: collect
        continue-on-error: true
        run: python scripts/collect.py
      - name: Save lightweight ledger and snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh job ledger and published snapshot [skip ci]'
            git push origin HEAD:main
          fi
      - name: Prepare public static assets
        run: |
          mkdir -p _site/web _site/data
          cp index.html .nojekyll _site/
          cp web/app.js web/analytics.js _site/web/
          cp data/jobs.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Source health summary
        run: |
          python - <<'PY'
          import json, os
          from collections import Counter
          d=json.load(open('data/jobs.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Career Radar\n\nActive jobs: '+str(len(d['jobs']))+'\n\n')
              f.write(str(dict(Counter(j['track'] for j in d['jobs'])))+'\n\n')
              for s in d['sources']:
                  f.write(f"- {s['company']}: {s.get('error') or 'OK'}; matched {s.get('matched',0)}\n")
          PY
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Flag total collection failure after publishing diagnostics
        if: needs.build.outputs.collection_outcome == 'failure'
        run: |
          echo 'All employer sources failed. Published retained data and failure diagnostics.'
          exit 1
